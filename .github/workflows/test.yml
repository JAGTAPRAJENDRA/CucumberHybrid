name: Run Cucumber Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Tests
        working-directory: CucumberHybrid/CucumberHybrid
        run: mvn clean test

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: Cucumber-Report
          path: CucumberHybrid/CucumberHybrid/target/
