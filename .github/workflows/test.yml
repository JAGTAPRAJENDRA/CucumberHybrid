name: Run Cucumber Tests

on:
  push:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maven
        run: sudo apt-get install maven -y

      - name: Run Tests
        working-directory: CucumberHybrid   # ✅ FIXED
        run: mvn clean test

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cucumber-Report
          path: CucumberHybrid/target/
